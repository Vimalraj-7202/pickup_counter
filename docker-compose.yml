# Starts the database, the API, and the customer screen.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pickup
      POSTGRES_PASSWORD: pickup
      POSTGRES_DB: pickup
    ports:
      - "5432:5432"
    volumes:
      - pickup-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup -d pickup"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://pickup:pickup@db:5432/pickup
      WEBHOOK_SECRET: dev-webhook-secret
      PORT: 3001
      HOLD_SECONDS: 120
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Not part of a normal start. Run: docker compose --profile test run --rm test
  test:
    build: ./backend
    profiles: ["test"]
    command: npx vitest run
    environment:
      ADMIN_DATABASE_URL: postgres://pickup:pickup@db:5432/pickup
      TEST_DATABASE_URL: postgres://pickup:pickup@db:5432/pickup_test
      WEBHOOK_SECRET: dev-webhook-secret
      HOLD_SECONDS: 120
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pickup-db:
